name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbid tracked frontend/dist
        run: |
          tracked="$(git ls-files frontend/dist)"
          if [[ -n "$tracked" ]]; then
            echo "frontend/dist must not be tracked:" >&2
            echo "$tracked" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend tests
        working-directory: backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
          pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build (produces dist artifact)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
